name: Refresh Google Scholar publications

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-scholar
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch publications (with retry + proxy fallback)
        id: fetch
        shell: bash
        run: |
          set +e
          USER_ID="oVm7TyYAAAAJ"
          OUT="publications.json"

          attempt() {
            local label="$1"; shift
            echo "::group::Attempt: $label"
            python scripts/fetch_scholar.py --user "$USER_ID" --out "$OUT" "$@"
            local rc=$?
            echo "::endgroup::"
            return $rc
          }

          attempt "direct (try 1)"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "Direct fetch failed (rc=$rc). Sleeping 30s then retrying direct."
            sleep 30
            attempt "direct (try 2)"
            rc=$?
          fi
          if [ $rc -ne 0 ]; then
            echo "Still failing (rc=$rc). Sleeping 60s then trying free proxies."
            sleep 60
            attempt "free-proxies" --use-free-proxies
            rc=$?
          fi

          if [ $rc -ne 0 ]; then
            echo "::error::All fetch attempts failed (rc=$rc). publications.json left untouched."
            exit $rc
          fi
          echo "Fetch succeeded."

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain publications.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publications.json
            git commit -m "chore: refresh publications from Google Scholar"
            git push
          else
            echo "No changes."
          fi
