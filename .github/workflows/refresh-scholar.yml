name: Refresh Google Scholar publications

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-scholar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch publications
        run: python scripts/fetch_scholar.py --user oVm7TyYAAAAJ --out publications.json

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain publications.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publications.json
            git commit -m "chore: refresh publications from Google Scholar"
            git push
          else
            echo "No changes."
          fi
